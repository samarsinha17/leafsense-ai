services:
  - type: web
    name: leafsense-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LEAFSENSE_MODEL_PATH
        sync: false
      - key: HUGGINGFACE_MODEL_REPO
        value: samarsinha2517/leafsense-ai-model
      - key: HUGGINGFACE_MODEL_FILE
        value: leafsense_model.keras
      - key: HUGGINGFACE_LABELS_FILE
        value: labels.json
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
