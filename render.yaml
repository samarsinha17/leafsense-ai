services:
  - type: web
    name: leafsense-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LEAFSENSE_MODEL_PATH
        sync: false
      - key: HUGGINGFACE_MODEL_REPO
        value: samarsinha2517/leafsense-ai-model
      - key: HUGGINGFACE_MODEL_FILE
        value: leafsense_model.keras
      - key: HUGGINGFACE_LABELS_FILE
        value: labels.json
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: HUGGINGFACE_SPACE_URL
        sync: false
      - key: HUGGINGFACE_SPACE_ENDPOINT
        value: /predict
      - key: ENABLE_MODEL_INFERENCE
        value: false
      - key: ISOLATE_MODEL_INFERENCE
        value: true
      - key: MODEL_WORKER_TIMEOUT_SECONDS
        value: 180
      - key: BACKEND_CORS_ORIGINS
        value: https://leafsense-ai-plum.vercel.app,http://localhost:5173,http://127.0.0.1:5173
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
